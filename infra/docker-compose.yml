version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tn_grievance_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tngrievance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tngrievance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tn_grievance_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-31T05-59-15Z
    container_name: tn_grievance_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: tn_grievance_api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tngrievance
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AI_STT_PROVIDER=mock
      - AI_TTS_PROVIDER=mock
      - AI_ROUTING_PROVIDER=mock
      - AI_DUPLICATE_PROVIDER=mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: tn_grievance_worker
    command: celery -A services.worker.src.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tngrievance
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: tn_grievance_web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
